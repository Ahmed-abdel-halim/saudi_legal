name: 🚀 Deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch: # يسمح بالتشغيل اليدوي من GitHub UI

env:
  PHP_VERSION: '8.3'
  APP_NAME: radiif-app

jobs:
  # ──────────────────────────────────────────────────
  # Job 1: Tests
  # ──────────────────────────────────────────────────
  test:
    name: ✅ Run Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: radif_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_mysql, xml, curl
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-php-

      - name: Install dependencies
        run: composer install --no-ansi --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Copy .env for testing
        run: |
          cp .env.example .env
          echo "DB_CONNECTION=mysql" >> .env
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_PORT=3306" >> .env
          echo "DB_DATABASE=radif_test" >> .env
          echo "DB_USERNAME=root" >> .env
          echo "DB_PASSWORD=root" >> .env
          echo "AZURE_SEARCH_ENABLED=false" >> .env

      - name: Generate App Key
        run: php artisan key:generate

      - name: Run Migrations
        run: php artisan migrate --force

      - name: Run Tests
        run: php artisan test --parallel

  # ──────────────────────────────────────────────────
  # Job 2: Build & Deploy
  # ──────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Azure
    runs-on: ubuntu-latest
    needs: test  # ينتظر نجاح الاختبارات
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_mysql, xml, curl

      - name: Install Composer dependencies (Production)
        run: composer install --no-dev --no-ansi --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm & Build Assets
        run: |
          npm ci
          npm run build

      - name: Create Production .env
        run: |
          cat > .env << 'EOF'
          APP_NAME=Radiif
          APP_ENV=production
          APP_DEBUG=false
          APP_URL=${{ secrets.APP_URL }}
          
          DB_CONNECTION=mysql
          DB_HOST=${{ secrets.AZURE_DB_HOST }}
          DB_PORT=3306
          DB_DATABASE=radif
          DB_USERNAME=${{ secrets.AZURE_DB_USERNAME }}
          DB_PASSWORD=${{ secrets.AZURE_DB_PASSWORD }}
          
          QUEUE_CONNECTION=database
          CACHE_STORE=database
          SESSION_DRIVER=database
          
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          
          AZURE_SEARCH_ENDPOINT=${{ secrets.AZURE_SEARCH_ENDPOINT }}
          AZURE_SEARCH_KEY=${{ secrets.AZURE_SEARCH_KEY }}
          AZURE_SEARCH_INDEX=legal-documents
          AZURE_SEARCH_ENABLED=true
          
          STRIPE_KEY=${{ secrets.STRIPE_KEY }}
          STRIPE_SECRET=${{ secrets.STRIPE_SECRET }}
          EOF
          
          php artisan key:generate --force

      - name: Optimize for Production
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan event:cache

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .

      - name: Run Post-Deploy Migrations
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp ssh --resource-group radiif-rg --name ${{ env.APP_NAME }} \
              --command "cd /home/site/wwwroot && php artisan migrate --force"

  # ──────────────────────────────────────────────────
  # Job 3: Health Check
  # ──────────────────────────────────────────────────
  health-check:
    name: 🏥 Health Check
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Wait for deployment
        run: sleep 30

      - name: Check App Health
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.APP_URL }})
          if [ "$response" != "200" ]; then
            echo "❌ Health check failed! Status: $response"
            exit 1
          fi
          echo "✅ App is healthy! Status: $response"
